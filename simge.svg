<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="z" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f2227"/><stop offset="1" stop-color="#0E0F11"/>
    </radialGradient>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="440">
      <stop offset="0" stop-color="#FFC976"/><stop offset="1" stop-color="#EE9418"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#z)"/>
  <g fill="url(#a)">
    <!-- makas bıçakları = A'nın bacakları (uçta incelir) -->
    <path d="M256 84 L274 108 L200 318 L168 306 Z"/>
    <path d="M256 84 L238 108 L312 318 L344 306 Z"/>
  </g>
  <g fill="none" stroke="url(#a)">
    <!-- halkalar = A'nın ayakları -->
    <circle cx="160" cy="370" r="50" stroke-width="28"/>
    <circle cx="352" cy="370" r="50" stroke-width="28"/>
    <!-- orta çizgi -->
    <line x1="202" y1="236" x2="310" y2="236" stroke-width="22" stroke-linecap="round"/>
  </g>
  <!-- vida -->
  <circle cx="256" cy="236" r="21" fill="#0E0F11" stroke="url(#a)" stroke-width="11"/>
</svg>
