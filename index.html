<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F11">
<title>Randevu al</title>
<style>
:root{--zemin:#0E0F11;--kart:#1A1C20;--kart2:#15171a;--cizgi:#26292e;--cizgi2:#33373d;--yazi:#F4F1EA;--soluk:#9a968d;--vurgu:#FFB547;--vurgu-koyu:#5a3d00;--yesil:#7fe38f;--kirmizi:#ff8a7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--zemin);color:var(--yazi)}
body{font-family:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.kap{max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100dvh;position:relative}
.ust{padding:calc(22px + env(safe-area-inset-top)) 22px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:13px;letter-spacing:.2em;color:var(--soluk);text-transform:uppercase}
.rozet{font-size:12px;padding:6px 10px;border-radius:20px;white-space:nowrap;background:#2a1d1d;color:var(--kirmizi)}
.rozet.acik{background:#1d2a1f;color:var(--yesil)}
.deneme{background:var(--vurgu);color:#111;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;padding:6px}
h1{font-size:clamp(36px,11vw,46px);line-height:1.02;font-weight:700;letter-spacing:-.02em;padding:18px 22px 20px}
h1 em{font-style:normal;color:var(--vurgu)}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 22px}
.k{background:var(--kart);border-radius:22px;padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--cizgi);text-align:left;transition:transform .12s}
.k:active{transform:scale(.97)}
.k b{font-size:17px;font-weight:600}.k span{font-size:13px;color:var(--soluk)}
.k.sec{background:var(--vurgu);color:#111;border-color:var(--vurgu)}.k.sec span{color:var(--vurgu-koyu)}
.k.genis{grid-column:span 2;min-height:72px;flex-direction:row;align-items:center}
.bas{font-size:13px;color:var(--soluk);padding:22px 22px 10px;display:flex;justify-content:space-between}
.gunler{display:flex;gap:8px;padding:0 22px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 22px}
.gunler::-webkit-scrollbar{display:none}
.g{flex:0 0 58px;border-radius:16px;background:var(--kart);text-align:center;padding:10px 0;border:1px solid var(--cizgi);scroll-snap-align:start}
.g small{display:block;font-size:11px;color:var(--soluk)}.g b{font-size:19px;font-weight:600}
.g.sec{background:var(--yazi);color:#111;border-color:var(--yazi)}.g.sec small{color:#555}
.g:disabled{opacity:.28;cursor:default}
.kume{font-size:12px;color:var(--soluk);padding:16px 22px 0;letter-spacing:.04em}
.saat{display:flex;gap:8px;padding:10px 22px 0;flex-wrap:wrap}
.s{padding:11px 16px;border-radius:30px;border:1px solid var(--cizgi2);font-size:15px;min-width:76px;text-align:center}
.s.sec{background:var(--vurgu);color:#111;border-color:var(--vurgu);font-weight:600}
.iskelet{height:42px;width:78px;border-radius:30px;background:linear-gradient(90deg,#1a1c20,#24272c,#1a1c20);background-size:200% 100%;animation:p 1.2s infinite}
@keyframes p{to{background-position:-200% 0}}
.bilgi{padding:18px 22px 0;color:var(--soluk);font-size:14px;line-height:1.5}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;background:var(--yazi);color:#111;border-radius:26px;padding:14px 14px 14px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:600;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .2s}
.cta small{display:block;font-weight:400;font-size:12px;color:#555;margin-top:2px}
.cta .ok{width:42px;height:42px;border-radius:50%;background:#111;color:var(--vurgu);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.cta:disabled{background:#2a2c31;color:var(--soluk);cursor:default}
.cta:disabled small{color:var(--soluk)}
.cta:disabled .ok{background:#1f2125;color:#55524c}
.perde{position:fixed;z-index:7;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.perde.ac{opacity:1;pointer-events:auto}
.sayfa{position:fixed;z-index:7;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:var(--kart2);border-radius:30px 30px 0 0;padding:14px 22px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi)}
.sayfa.ac{transform:translate(-50%,0)}
.tutac{width:44px;height:5px;border-radius:3px;background:#3a3e44;margin:0 auto 18px}
.sayfa h2{font-size:24px;font-weight:700;margin-bottom:14px}
.ozet{background:var(--kart);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border:1px solid var(--cizgi);gap:10px}
.ozet b{font-size:15px}.ozet small{display:block;color:var(--soluk);font-size:12px;margin-top:2px}
.ozet button{font-size:13px;color:var(--vurgu)}
label{font-size:12px;color:var(--soluk);display:block;margin:0 0 6px 4px}
input{width:100%;background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:15px 16px;font:inherit;font-size:16px;color:var(--yazi);outline:none;margin-bottom:12px}
input:focus{border-color:var(--vurgu)}
input.hata{border-color:var(--kirmizi)}
.gizli{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.not{font-size:12px;color:var(--soluk);line-height:1.5;margin:2px 0 16px}
.hata-yazi{color:var(--kirmizi);font-size:13px;min-height:18px;margin-bottom:8px}
.ana-d{width:100%;background:var(--vurgu);color:#111;border-radius:22px;padding:18px;font-size:16px;font-weight:700}
.ana-d:disabled{opacity:.5}
.onay{padding:calc(70px + env(safe-area-inset-top)) 26px 0}
.halka{width:84px;height:84px;border-radius:50%;background:var(--vurgu);display:flex;align-items:center;justify-content:center;margin-bottom:28px;animation:b .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes b{from{transform:scale(.3);opacity:0}}
.buyuk{font-size:clamp(36px,11vw,44px);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin-bottom:24px}
.buyuk em{font-style:normal;color:var(--vurgu)}
.bilet{background:var(--kart);border:1px solid var(--cizgi);border-radius:24px;padding:6px 18px}
.bilet p{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:12px 0;border-bottom:1px dashed #2f3237;text-align:right}
.bilet p:last-child{border:0}
.bilet p span{color:var(--soluk);text-align:left}
.ikinci{width:100%;margin-top:14px;border:1px solid #3a3e44;border-radius:22px;padding:16px;font-weight:600}
.bag{display:block;text-align:center;color:var(--soluk);font-size:14px;margin-top:18px;text-decoration:underline}
.tost{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--kirmizi);color:#111;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;transition:transform .3s;max-width:calc(100% - 32px);z-index:9}
.tost{visibility:hidden}
.tost.ac{transform:translate(-50%,0);visibility:visible}
[hidden]{display:none!important}
.kvkk{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:7px 14px calc(7px + env(safe-area-inset-bottom));background:var(--kart2);border-top:1px solid var(--cizgi);color:var(--soluk);font-size:11px;line-height:1.32}
.kvkk[hidden]{display:none}
.kvkk p{flex:1;min-width:0;overflow-wrap:anywhere}
.kvkk-d{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:none}
.kvkk .kvkk-a{min-height:30px;border:0;color:var(--soluk);font-size:12px;font-weight:600;text-decoration:underline;padding:2px 6px}
.kvkk button{flex:none;min-height:34px;padding:5px 12px;border-radius:12px;border:1px solid var(--vurgu);background:transparent;color:var(--vurgu);font-size:13px;font-weight:700}
body.kvkk-var .cta{bottom:calc(var(--kvkk-h,0px) + 16px + env(safe-area-inset-bottom))}
body.kvkk-var .bln{bottom:calc(var(--kvkk-h,0px) + 98px + env(safe-area-inset-bottom))}
/* asistan balonu (mevcut renkler) */
.bln{position:fixed;z-index:7;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--vurgu);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bln .rz{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--kirmizi);color:#111;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bln:active{transform:scale(.95)}
body:has(.sayfa.ac) .bln{display:none}
.blp{position:fixed;z-index:7;left:0;right:0;bottom:0;height:80dvh;max-height:80dvh;background:var(--kart2);border-top:1px solid var(--cizgi);border-radius:26px 26px 0 0;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.blp.ac{transform:translateY(0);visibility:visible}
@media(min-width:600px){.blp{left:auto;right:16px;bottom:16px;width:360px;height:520px;border:1px solid var(--cizgi);border-radius:24px}.bln{bottom:24px}}
.blu{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--cizgi)}
.blu b{font-size:16px;display:block}.blu small{font-size:13px;color:var(--soluk)}
.blk{width:44px;height:44px;border-radius:50%;border:1px solid var(--cizgi2);font-size:20px;line-height:1;flex:none}
.blu>div:first-child{min-width:0}.blu b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blsag{display:flex;align-items:center;gap:8px;flex:none}
.blr{min-height:44px;padding:0 14px;border-radius:30px;border:1px solid var(--vurgu);background:var(--vurgu);color:#111;font-size:14px;font-weight:700}
.blr:active{transform:scale(.97)}
.bls{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.blm{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.balon-not{color:var(--soluk);font-size:12px;text-align:center;line-height:1.4;padding:2px 8px}
.blm.ben{align-self:flex-end;background:var(--vurgu);color:#111;border-bottom-right-radius:6px}
.blm.asi{align-self:flex-start;background:var(--kart);border:1px solid var(--cizgi);border-bottom-left-radius:6px}
.bld{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.bld button{min-height:44px;padding:10px 16px;border-radius:30px;border:1px solid var(--cizgi2);font-size:15px}
.bld.oner{gap:6px}.bld.oner button{min-height:36px;padding:6px 12px;font-size:13px;color:var(--soluk)}
.blt{padding:0 16px 8px}.blt input{margin-bottom:0}
.bly{display:flex;gap:8px;padding:8px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi)}
.bly input{margin-bottom:0;flex:1;min-width:0;padding:12px 14px;border-radius:22px}
.bly button{min-height:44px;padding:0 18px;border-radius:22px;background:var(--vurgu);color:#111;font-weight:700;font-size:15px}
.bly button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="kvkk" id="kvkk" hidden><p id="kvkkMetin"></p><div class="kvkk-d"><button type="button" class="kvkk-a" id="kvkkAyrinti" aria-expanded="false">Ayrıntı</button><button type="button" id="kvkkTamam">Tamam</button></div></div>
<div class="deneme" id="deneme" hidden>DENEME — sahte veri, randevu kaydedilmez</div>

<main class="kap" id="secim">
  <div class="ust"><div class="logo" id="dukkan">&nbsp;</div><div class="rozet" id="rozet" hidden></div></div>
  <h1>Yerini<br><em>ayırt.</em></h1>
  <div class="izgara" id="hizmetler"></div>
  <div class="bas"><span id="gunBaslik">Gün seçin</span></div>
  <div class="gunler" id="gunler"></div>
  <div id="saatler"></div>
</main>

<section class="kap" id="onay" hidden>
  <div class="onay">
    <div class="halka"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="buyuk">Görüşmek<br>üzere, <em id="onayGun"></em></div>
    <div class="bilet" id="bilet"></div>
    <button class="ikinci" id="takvim">Takvime ekle</button>
    <a href="#" class="bag" id="yeni">Yeni randevu al</a>
  </div>
</section>

<button class="cta" id="cta" disabled><div id="ctaYazi">Saat seçin<small>&nbsp;</small></div><div class="ok">→</div></button>

<div class="perde" id="perde"></div>
<form class="sayfa" id="sayfa" autocomplete="on" novalidate>
  <div class="tutac"></div>
  <h2>Son adım</h2>
  <div class="ozet"><div id="ozet"></div><button type="button" id="degistir">Değiştir</button></div>
  <label for="ad">Ad soyad</label>
  <input id="ad" name="name" autocomplete="name" maxlength="40" placeholder="Adınız">
  <label for="tel">Telefon</label>
  <input id="tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="05xx xxx xx xx">
  <input class="gizli" id="site" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="not">Telefonunuz yalnız randevunuz için berbere iletilir.</p>
  <div class="hata-yazi" id="hataYazi"></div>
  <button class="ana-d" id="onayla" type="submit">Randevuyu onayla</button>
</form>
<div class="tost" id="tost"></div>

<button class="bln" id="bln" aria-label="Soru sor" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/></svg><span class="rz" id="blRozet" hidden></span></button>
<section class="blp" id="blp" aria-label="Asistan">
  <div class="blu"><div><b id="blDukkan">&nbsp;</b><small>Sorularınızı yanıtlıyoruz</small></div><div class="blsag"><button class="blr" id="blRandevu" type="button">Randevu al</button><button class="blk" id="blKapat" aria-label="Kapat">&times;</button></div></div>
  <div class="bls" id="blSohbet"></div>
  <div class="bld" id="blDugme"></div>
  <div class="blt" id="blTelKutu" hidden><label for="blTel">Telefon numaranız</label><input id="blTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="05xx xxx xx xx"></div>
  <form class="bly" id="blForm"><input id="blGiris" autocomplete="off" placeholder="Sorunuzu yazın…"><button id="blGonder" type="submit">Gönder</button></form>
</section>

<script src="ayar.js"></script>
<script src="index.js"></script>
</body>
</html>
